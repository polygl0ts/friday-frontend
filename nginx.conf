server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin stand-in for the public Nextcloud calendar. The host sends
    # no CORS headers, so the page fetches /calendar.ics and nginx fetches the
    # feed. Keep the URL in sync with CALENDAR_FEED_URL in src/calendarFeed.ts.
    # The trailing ? drops any query string the browser sent.
    location = /calendar.ics {
        proxy_ssl_server_name on;
        proxy_ssl_name clic.epfl.ch;
        proxy_set_header Host clic.epfl.ch;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_redirect off;
        rewrite ^ /nextcloud/remote.php/dav/public-calendars/7efWxYZe9ECKSJMC?export? break;
        proxy_pass https://clic.epfl.ch;
    }

    location = /healthz {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
